name: Deploy to GitHub Pages

# Builds and deploys on every push to main, and can also be triggered
# manually from the Actions tab (workflow_dispatch). Adjust the branch
# name below if this repo's default branch isn't "main".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the official GitHub Pages deploy action: it uploads the
# build as an artifact then publishes it via GitHub's own Pages
# infrastructure (id-token: write is needed for that publish step to
# authenticate), rather than pushing built files to a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment should ever be in flight at once - if a second
# push lands while a deploy is still running, cancel the in-progress one
# rather than letting them race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4